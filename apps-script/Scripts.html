<script>
(() => {
  'use strict';

  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
  const STORAGE_ACTOR = 'casaEnOrden.actor';
  const STORAGE_DEMO = 'casaEnOrden.demoData';
  const DEMO_MODE = new URLSearchParams(location.search).get('demo') === '1' ||
    !(window.google && google.script && google.script.run);
  const PWA_CHANNEL = document.body.dataset.pwaChannel || '';
  let PWA_ACCESS_TOKEN = '';
  let PWA_DEVICE_ID = '';
  let PWA_DEVICE_OWNER = '';
  let itemAttachmentDraft = null;
  let itemAttachmentPreparing = false;
  let itemAttachmentSelectionId = 0;
  let itemExistingAttachment = null;
  let itemOriginalType = '';
  let catalogImageDraft = null;
  let catalogImagePreparing = false;
  let catalogImageSelectionId = 0;

  const state = {
    data: { settings: {}, items: [], activity: [], catalog: [] },
    actor: localStorage.getItem(STORAGE_ACTOR) || '',
    activeView: 'home',
    filter: 'Todos',
    search: '',
    selectedId: '',
    syncing: false,
    latestActivityId: '',
    confirmResolve: null,
    settingsDirty: false,
    authenticated: false,
    remoteRefreshPending: false
  };

  const els = {
    app: $('#app'), loading: $('#loadingScreen'), overlay: $('#overlay'),
    title: $('#homeTitle'), actorButton: $('#actorButton'), actorName: $('#actorName'), actorAvatar: $('#actorAvatar'),
    greeting: $('#homeGreeting'), summary: $('#summaryCards'), services: $('#serviceCards'),
    shopping: $('#shoppingCards'), repairs: $('#repairCards'), pendingList: $('#pendingList'),
    pendingSearch: $('#pendingSearch'), activity: $('#activityList'), fab: $('#fab'),
    syncPill: $('#syncPill'), syncText: $('#syncText'), refreshButton: $('#refreshButton'),
    toastRegion: $('#toastRegion'), actorSheet: $('#actorSheet'), actorOptions: $('#actorOptions'),
    formSheet: $('#formSheet'), itemForm: $('#itemForm'), formTitle: $('#formSheetTitle'),
    formKicker: $('#formSheetKicker'), saveItemButton: $('#saveItemButton'),
    itemFile: $('#itemFile'), itemFileLabel: $('#itemFileLabel'), itemAttachmentPreview: $('#itemAttachmentPreview'),
    itemAttachmentPreviewImg: $('#itemAttachmentPreviewImg'), itemAttachmentFileIcon: $('#itemAttachmentFileIcon'),
    removeItemAttachment: $('#removeItemAttachment'),
    catalogList: $('#catalogList'), catalogSearch: $('#catalogSearch'), catalogSuggestions: $('#catalogSuggestions'),
    selectedCatalog: $('#selectedCatalog'), catalogFormSheet: $('#catalogFormSheet'), catalogForm: $('#catalogForm'),
    saveCatalogButton: $('#saveCatalogButton'), toggleCatalogButton: $('#toggleCatalogButton'),
    catalogImageFile: $('#catalogImageFile'), catalogImagePreview: $('#catalogImagePreview'),
    catalogImagePreviewImg: $('#catalogImagePreviewImg'), catalogImageLabel: $('#catalogImageLabel'),
    removeCatalogImage: $('#removeCatalogImage'),
    detailSheet: $('#detailSheet'), detailContent: $('#detailContent'), settingsForm: $('#settingsForm'),
    confirmDialog: $('#confirmDialog'), confirmTitle: $('#confirmTitle'), confirmMessage: $('#confirmMessage'),
    confirmAccept: $('#confirmAccept'), confirmCancel: $('#confirmCancel')
  };

  document.addEventListener('DOMContentLoaded', init);

  function init() {
    bindEvents();
    if (DEMO_MODE) {
      state.authenticated = true;
      loadData({ initial: true });
    } else if (PWA_CHANNEL) {
      postToPwa({ type: 'casa-en-orden:shell-ready' });
    } else {
      showLockedState();
    }
  }

  function bindEvents() {
    $$('.nav-item').forEach(button => button.addEventListener('click', () => navigate(button.dataset.view)));
    $$('[data-close-sheet]').forEach(button => button.addEventListener('click', closeSheets));
    $$('[data-view-link]').forEach(button => button.addEventListener('click', () => {
      state.filter = button.dataset.filterLink || 'Todos';
      navigate(button.dataset.viewLink);
    }));
    els.actorButton.addEventListener('click', () => openSheet(els.actorSheet));
    els.refreshButton.addEventListener('click', () => loadData({ manual: true }));
    els.overlay.addEventListener('click', () => {
      if (!els.confirmDialog.hidden) return;
      closeSheets();
    });
    els.pendingSearch.addEventListener('input', event => {
      state.search = event.target.value;
      renderPending();
    });
    $('#filterChips').addEventListener('click', event => {
      const chip = event.target.closest('[data-filter]');
      if (!chip) return;
      state.filter = chip.dataset.filter;
      renderPending();
    });
    document.addEventListener('click', handleGlobalClick);
    document.addEventListener('keydown', handleKeyboard);
    els.itemForm.addEventListener('submit', handleItemSubmit);
    els.itemForm.addEventListener('change', event => {
      if (event.target.name === 'type') {
        handleItemTypeChange(event.target.value);
        updateConditionalFields();
      }
      if (event.target.name === 'serviceMode' || event.target.name === 'recurrence') updateConditionalFields();
    });
    els.itemFile.addEventListener('change', handleItemAttachmentSelection);
    els.removeItemAttachment.addEventListener('click', clearItemAttachment);
    els.settingsForm.addEventListener('input', () => { state.settingsDirty = true; });
    els.settingsForm.addEventListener('submit', handleSettingsSubmit);
    $('#deviceSettingsButton').addEventListener('click', () => postToPwa({ type: 'casa-en-orden:open-notification-settings' }));
    els.catalogSearch.addEventListener('input', renderCatalogSuggestions);
    els.catalogSearch.addEventListener('focus', renderCatalogSuggestions);
    els.catalogSuggestions.addEventListener('click', handleCatalogSuggestion);
    els.selectedCatalog.addEventListener('click', event => {
      if (event.target.closest('[data-clear-catalog]')) clearSelectedCatalog();
    });
    els.catalogForm.addEventListener('submit', handleCatalogSubmit);
    els.catalogImageFile.addEventListener('change', handleCatalogImageSelection);
    els.removeCatalogImage.addEventListener('click', clearCatalogImage);
    els.toggleCatalogButton.addEventListener('click', handleCatalogToggle);
    els.actorOptions.addEventListener('click', handleActorChoice);
    els.detailContent.addEventListener('click', handleDetailClick);
    els.detailContent.addEventListener('change', handleDetailChange);
    els.confirmCancel.addEventListener('click', () => finishConfirm(false));
    els.confirmAccept.addEventListener('click', () => finishConfirm(true));
    window.addEventListener('message', handlePwaMessage);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && state.authenticated) requestFreshData('foreground');
    });
    window.addEventListener('pageshow', () => {
      if (state.authenticated && !state.syncing) requestFreshData('foreground');
    });
  }

  function handleGlobalClick(event) {
    const catalogAdd = event.target.closest('[data-open-catalog-form]');
    if (catalogAdd) {
      openCatalogForm();
      return;
    }
    const catalogCard = event.target.closest('[data-catalog-id]');
    if (catalogCard) {
      const entry = findCatalogEntry(catalogCard.dataset.catalogId);
      if (entry) openCatalogForm(entry);
      return;
    }
    const addButton = event.target.closest('[data-open-form]');
    if (addButton) {
      openForm();
      return;
    }
    const itemCard = event.target.closest('[data-item-id]');
    if (itemCard && !event.target.closest('[data-quick-action]')) {
      openDetail(itemCard.dataset.itemId);
      return;
    }
    const portal = event.target.closest('[data-open-portal]');
    if (portal) {
      event.stopPropagation();
      window.open(portal.dataset.openPortal, '_blank', 'noopener');
    }
  }

  function handleKeyboard(event) {
    if (event.key === 'Escape') {
      if (!els.confirmDialog.hidden) finishConfirm(false);
      else closeSheets();
    }
    if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('[data-item-id]')) {
      event.preventDefault();
      openDetail(event.target.dataset.itemId);
    }
  }

  async function loadData(options = {}) {
    if (state.syncing) return;
    state.syncing = true;
    showSync('Sincronizando…', true);
    els.refreshButton.classList.add('is-spinning');

    try {
      const previousActivityId = state.latestActivityId;
      const data = await api('getBootstrapData');
      state.data = data;
      validateActor();
      state.latestActivityId = data.activity[0] ? data.activity[0].id : '';
      renderAll();
      postPwaState();

      if (!options.initial && previousActivityId && state.latestActivityId !== previousActivityId) {
        const newest = data.activity[0];
        if (newest && newest.actor !== state.actor) toast(newest.description);
      }
      showSync(options.manual ? 'Actualizado ahora' : 'Sincronizado ahora');
    } catch (error) {
      console.error(error);
      toast(errorMessage(error), 'error', 6500);
      showSync('No se pudo sincronizar');
    } finally {
      state.syncing = false;
      els.refreshButton.classList.remove('is-spinning');
      if (options.initial) {
        els.loading.hidden = true;
        els.app.hidden = false;
      }
    }
  }

  function renderAll() {
    renderChrome();
    renderDashboard();
    renderPending();
    renderActivity();
    renderCatalogList();
    renderActorOptions();
    renderResponsibleChoices();
    if (!state.settingsDirty) renderSettings();
  }

  function renderChrome() {
    const settings = state.data.settings;
    els.title.textContent = settings.homeName || 'Casa en Orden';
    els.actorName.textContent = state.actor;
    els.actorAvatar.textContent = initials(state.actor);
    els.actorAvatar.className = `avatar ${state.actor === settings.person2Name ? 'avatar-clay' : 'avatar-sage'}`;
    els.greeting.textContent = `Hola, ${firstName(state.actor)}`;
    document.title = settings.homeName || 'Casa en Orden';
  }

  function renderDashboard() {
    const pending = state.data.items.filter(item => item.status === 'Pendiente');
    const urgent = pending.filter(item => item.priority === 'Urgente');
    const dueSoon = pending.filter(item => daysUntil(item.dueDate) >= 0 && daysUntil(item.dueDate) <= 7);
    els.summary.innerHTML = [
      summaryCard('✓', pending.length, 'pendientes', ''),
      summaryCard('!', urgent.length, 'urgentes', 'urgent'),
      summaryCard('▣', dueSoon.length, 'por vencer', 'due')
    ].join('');

    const sortByDue = (a, b) => {
      if (!a.dueDate && !b.dueDate) return String(b.updatedAt).localeCompare(String(a.updatedAt));
      if (!a.dueDate) return 1;
      if (!b.dueDate) return -1;
      return a.dueDate.localeCompare(b.dueDate);
    };
    const serviceItems = pending.filter(item => item.type === 'Servicio').sort(sortByDue).slice(0, 3);
    const shoppingItems = pending.filter(item => item.type === 'Despensa').sort(prioritySort).slice(0, 3);
    const repairItems = pending.filter(item => item.type === 'Reparación').sort(prioritySort).slice(0, 3);

    els.services.innerHTML = serviceItems.length
      ? serviceItems.map(item => itemCard(item, { serviceAction: true })).join('')
      : emptyState('🧾', 'Sin pagos próximos', 'Agrega luz, agua, gas o internet y te ayudaremos con las fechas.');
    els.shopping.innerHTML = shoppingItems.length
      ? shoppingItems.map(item => itemCard(item)).join('')
      : emptyState('🛒', 'La lista está vacía', 'Lo que cualquiera agregue aparecerá aquí para ambos.');
    els.repairs.innerHTML = repairItems.length
      ? repairItems.map(item => itemCard(item)).join('')
      : emptyState('🔧', 'Todo funciona por ahora', 'Cuando algo falle, registren aquí el detalle y quién lo atenderá.');
  }

  function renderPending() {
    $$('.filter-chip').forEach(chip => chip.classList.toggle('is-active', chip.dataset.filter === state.filter));
    let items = [...state.data.items];
    if (state.filter === 'Completado') items = items.filter(item => item.status === 'Completado');
    else {
      items = items.filter(item => item.status === 'Pendiente');
      if (state.filter !== 'Todos') items = items.filter(item => item.type === state.filter);
    }
    const query = normalizeText(state.search);
    if (query) items = items.filter(item => normalizeText(`${item.title} ${item.detail} ${item.responsible} ${item.createdBy}`).includes(query));
    items.sort(prioritySort);

    els.pendingList.innerHTML = items.length
      ? items.map(item => itemCard(item, { detailed: true })).join('')
      : emptyState('✓', state.search ? 'No encontramos coincidencias' : 'No hay pendientes aquí', state.search ? 'Prueba con otra palabra o categoría.' : 'Cuando agreguen algo nuevo aparecerá en esta lista.', true);
  }

  function renderActivity() {
    const activity = state.data.activity;
    els.activity.innerHTML = activity.length ? activity.map(entry => {
      const isSecond = entry.actor === state.data.settings.person2Name;
      return `<article class="timeline-item">
        <span class="timeline-avatar ${isSecond ? 'clay' : ''}">${escapeHtml(initials(entry.actor))}</span>
        <div class="timeline-card"><p>${escapeHtml(entry.description)}</p><small>${escapeHtml(entry.actor)} · ${relativeTime(entry.date)}</small></div>
      </article>`;
    }).join('') : emptyState('◷', 'Aún no hay movimientos', 'Aquí aparecerá quién agregó, cambió o completó cada pendiente.');
  }

  function renderActorOptions() {
    const settings = state.data.settings;
    const people = [
      { name: settings.person1Name, email: settings.person1Email, className: 'avatar-sage' },
      { name: settings.person2Name, email: settings.person2Email, className: 'avatar-clay' }
    ];
    els.actorOptions.innerHTML = people.map(person => `<button class="actor-option" type="button" data-actor="${escapeAttr(person.name)}">
      <span class="avatar ${person.className}">${escapeHtml(initials(person.name))}</span>
      <span><strong>${escapeHtml(person.name)}</strong><small>${escapeHtml(person.email || 'Sin correo configurado')}</small></span>
      ${person.name === state.actor ? '<svg class="icon selected-check"><use href="#i-check"/></svg>' : ''}
    </button>`).join('');
  }

  function renderResponsibleChoices(selected = '') {
    const settings = state.data.settings;
    const choices = [settings.person1Name, settings.person2Name];
    const active = selected || state.actor || choices[0];
    $('#responsibleChoices').innerHTML = choices.map((name, index) => `<label>
      <input type="radio" name="responsible" value="${escapeAttr(name)}" ${name === active ? 'checked' : ''}>
      <span><i class="avatar avatar-small ${index ? 'avatar-clay' : 'avatar-sage'}">${escapeHtml(initials(name))}</i>${escapeHtml(name)}</span>
    </label>`).join('');
  }

  function renderSettings() {
    const settings = state.data.settings;
    $('#settingHomeName').value = settings.homeName || '';
    $('#settingPerson1Name').value = settings.person1Name || '';
    $('#settingPerson1Email').value = settings.person1Email || '';
    $('#settingPerson2Name').value = settings.person2Name || '';
    $('#settingPerson2Email').value = settings.person2Email || '';
    $('#settingSendEmails').checked = Boolean(settings.sendEmails);
    $('#deviceOwnerLabel').textContent = PWA_DEVICE_OWNER ? `Este teléfono es de ${firstName(PWA_DEVICE_OWNER)}` : 'Este teléfono está vinculado';
  }

  function renderCatalogList() {
    const entries = state.data.catalog || [];
    els.catalogList.innerHTML = entries.length ? entries.map(entry => {
      const summary = catalogEntryDescription(entry) || 'Sin descripción';
      const thumb = catalogThumbnail(entry);
      return `<button class="catalog-card ${entry.active ? '' : 'is-inactive'}" type="button" data-catalog-id="${escapeAttr(entry.id)}">
        ${thumb}<span class="catalog-card-copy"><strong>${escapeHtml(entry.alias)}</strong><small>${escapeHtml(summary)}</small></span>
        <span class="status-badge">${entry.active ? 'Activo' : 'Inactivo'}</span>
      </button>`;
    }).join('') : emptyState('📦', 'Tu catálogo está vacío', 'Agrega focos, filtros, papel y otros productos que necesiten recordar.');
  }

  function summaryCard(icon, number, label, className) {
    return `<div class="summary-card ${className}"><span class="summary-icon">${icon}</span><strong class="summary-number">${number}</strong><span class="summary-label">${label}</span></div>`;
  }

  function itemCard(item, options = {}) {
    const icon = typeIcon(item.type);
    const photoUrl = itemProductPhotoUrl(item);
    const iconClass = `${item.type === 'Servicio' ? 'service' : item.type === 'Reparación' ? 'repair' : item.type === 'Otro' ? 'other' : ''}${photoUrl ? ' has-photo' : ''}`;
    const visual = photoUrl ? `<img src="${escapeAttr(photoUrl)}" alt="" loading="lazy">` : icon;
    const due = dueLabel(item.dueDate);
    const meta = [];
    if (item.amount !== '' && item.amount != null) meta.push(`<strong class="item-amount">${currency(item.amount)}</strong>`);
    if (due) meta.push(`<span>${escapeHtml(due)}</span>`);
    if (item.type === 'Servicio' && item.serviceMode === 'Recurrente') meta.push(`<span>↻ ${escapeHtml(item.recurrence || 'Recurrente')}</span>`);
    if (item.quantity !== '' && item.quantity != null && Number(item.quantity) > 0 && item.type !== 'Servicio') meta.push(`<span>Cant. ${number(item.quantity)}</span>`);
    if (options.detailed && item.responsible) meta.push(`<span>Responsable: ${escapeHtml(item.responsible)}</span>`);
    if (!options.detailed && item.createdBy) meta.push(`<span>${item.createdBy === state.actor ? 'Lo agregaste tú' : `${escapeHtml(item.createdBy)} lo agregó`}</span>`);

    let end = '';
    if (options.serviceAction && item.portalUrl) {
      end = `<button class="quick-action" type="button" data-quick-action data-open-portal="${escapeAttr(item.portalUrl)}">Pagar</button>`;
    } else {
      const badge = item.status === 'Completado'
        ? '<span class="status-badge complete">Completado</span>'
        : item.priority === 'Urgente'
          ? '<span class="status-badge urgent">Urgente</span>'
          : daysUntil(item.dueDate) >= 0 && daysUntil(item.dueDate) <= 7
            ? '<span class="status-badge due-soon">Por vencer</span>'
            : '<svg class="icon icon-sm chevron"><use href="#i-chevron"/></svg>';
      end = badge;
    }

    return `<article class="item-card ${item.status === 'Completado' ? 'is-completed' : ''}" role="button" tabindex="0" data-item-id="${escapeAttr(item.id)}">
      <span class="item-icon ${iconClass}">${visual}</span>
      <span class="item-copy"><span class="item-title">${escapeHtml(item.title)}</span><span class="item-meta">${meta.join('')}</span></span>
      <span class="item-end">${end}</span>
    </article>`;
  }

  function emptyState(icon, title, message, action = false) {
    return `<div class="empty-state"><span class="empty-icon">${icon}</span><strong>${escapeHtml(title)}</strong><p>${escapeHtml(message)}</p>${action ? '<button class="primary-small" type="button" data-open-form>Agregar pendiente</button>' : ''}</div>`;
  }

  function navigate(view) {
    state.activeView = view;
    $$('.view').forEach(section => section.classList.toggle('is-active', section.id === `view-${view}`));
    $$('.nav-item').forEach(button => button.classList.toggle('is-active', button.dataset.view === view));
    els.fab.hidden = view === 'profile';
    if (view === 'pending') renderPending();
    if (view === 'profile') renderSettings();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function openForm(item = null) {
    els.itemForm.reset();
    clearSelectedCatalog();
    resetItemAttachmentForm(item);
    $('#itemId').value = item ? item.id : '';
    els.formTitle.textContent = item ? 'Editar pendiente' : 'Nuevo pendiente';
    els.formKicker.textContent = item ? 'Actualizar información' : 'Agregar a la lista';
    els.saveItemButton.textContent = item ? 'Guardar cambios' : 'Guardar y avisar';

    if (item) {
      setRadio('type', item.type);
      $('#itemTitle').value = item.title || '';
      $('#itemDetail').value = item.detail || '';
      $('#itemQuantity').value = item.quantity === '' ? '' : item.quantity;
      $('#itemAmount').value = item.amount === '' ? '' : item.amount;
      $('#itemPortal').value = item.portalUrl || '';
      $('#itemDueDate').value = item.dueDate || '';
      $('#itemCatalogId').value = item.catalogId || '';
      setRadio('serviceMode', item.serviceMode || 'Único');
      $('#itemRecurrence').value = item.recurrence || 'Mensual';
      $('#itemRecurrenceDays').value = item.recurrenceDays || '';
      $('#itemRepeatAmount').checked = Boolean(item.repeatAmount);
      setRadio('priority', item.priority || 'Normal');
      renderResponsibleChoices(item.responsible);
      const catalogEntry = findCatalogEntry(item.catalogId);
      if (catalogEntry) showSelectedCatalog(catalogEntry);
      if (itemExistingAttachment) {
        showItemAttachmentPreview(
          itemExistingAttachment.url,
          itemExistingAttachment.name,
          item.type !== 'Servicio' && isImageFilename(itemExistingAttachment.name),
          item.type === 'Servicio' ? 'Comprobante actual' : 'Foto actual'
        );
      }
    } else {
      renderResponsibleChoices(state.actor);
      setRadio('type', 'Despensa');
      setRadio('priority', 'Normal');
      setRadio('serviceMode', 'Único');
      $('#itemRecurrence').value = 'Mensual';
      $('#itemRepeatAmount').checked = true;
    }
    updateConditionalFields();
    openSheet(els.formSheet);
    setTimeout(() => $('#itemTitle').focus(), 310);
  }

  function updateConditionalFields() {
    const type = checkedValue('type');
    const isService = type === 'Servicio';
    const isRecurring = isService && checkedValue('serviceMode') === 'Recurrente';
    $('#amountField').hidden = !isService;
    $('#serviceOptions').hidden = !isService;
    $('#recurrenceFields').hidden = !isRecurring;
    $('#customRecurrenceField').hidden = !isRecurring || $('#itemRecurrence').value !== 'Personalizada';
    $('#itemDueDate').required = isRecurring;
    $('#itemRecurrenceDays').required = isRecurring && $('#itemRecurrence').value === 'Personalizada';
    $('#itemPortalLabel').innerHTML = isService ? 'Portal de pago <span>opcional</span>' : 'Enlace de compra <span>opcional</span>';
    updateItemAttachmentControls();
    renderCatalogSuggestions();
  }

  function renderCatalogSuggestions() {
    if ($('#itemCatalogId').value) {
      els.catalogSuggestions.hidden = true;
      return;
    }
    const query = normalizeText(els.catalogSearch.value);
    if (!query) {
      els.catalogSuggestions.hidden = true;
      els.catalogSuggestions.innerHTML = '';
      return;
    }
    const entries = (state.data.catalog || [])
      .filter(entry => entry.active)
      .map(entry => ({ entry, score: catalogSearchScore(entry, query) }))
      .filter(result => result.score >= 0)
      .sort((a, b) => b.score - a.score || String(a.entry.alias).localeCompare(String(b.entry.alias), 'es', { sensitivity: 'base' }))
      .slice(0, 7)
      .map(result => result.entry);
    if (!entries.length) {
      els.catalogSuggestions.hidden = true;
      els.catalogSuggestions.innerHTML = '';
      return;
    }
    els.catalogSuggestions.innerHTML = entries.map(entry => `<button class="catalog-suggestion" type="button" data-select-catalog="${escapeAttr(entry.id)}">
      ${catalogThumbnail(entry)}<span><strong>${escapeHtml(entry.alias)}</strong><small>${escapeHtml(catalogEntryDescription(entry) || 'Referencia del catálogo')}</small></span>
    </button>`).join('');
    els.catalogSuggestions.hidden = false;
  }

  function handleCatalogSuggestion(event) {
    const button = event.target.closest('[data-select-catalog]');
    if (!button) return;
    const entry = findCatalogEntry(button.dataset.selectCatalog);
    if (entry) applyCatalogEntry(entry);
  }

  function applyCatalogEntry(entry) {
    $('#itemCatalogId').value = entry.id;
    $('#itemTitle').value = entry.alias;
    $('#itemDetail').value = catalogEntryDescription(entry);
    $('#itemPortal').value = entry.purchaseUrl || '';
    showSelectedCatalog(entry);
    updateConditionalFields();
  }

  function showSelectedCatalog(entry) {
    els.catalogSearch.value = entry.alias;
    els.catalogSuggestions.hidden = true;
    els.selectedCatalog.innerHTML = `${catalogThumbnail(entry)}<span><strong>${escapeHtml(entry.alias)}</strong><small>${escapeHtml(catalogEntryDescription(entry) || 'Datos del catálogo aplicados')}</small></span><button class="clear-catalog" type="button" data-clear-catalog aria-label="Quitar vínculo con el catálogo">×</button>`;
    els.selectedCatalog.hidden = false;
  }

  function clearSelectedCatalog() {
    $('#itemCatalogId').value = '';
    els.catalogSearch.value = '';
    els.catalogSuggestions.hidden = true;
    els.catalogSuggestions.innerHTML = '';
    els.selectedCatalog.hidden = true;
    els.selectedCatalog.innerHTML = '';
  }

  async function handleItemSubmit(event) {
    event.preventDefault();
    if (itemAttachmentPreparing) {
      toast('Espera un momento mientras preparamos la imagen.');
      return;
    }
    const form = new FormData(els.itemForm);
    const payload = {
      id: form.get('id') || '',
      type: form.get('type'),
      title: form.get('title'),
      detail: form.get('detail'),
      quantity: form.get('quantity'),
      amount: form.get('amount'),
      dueDate: form.get('dueDate'),
      priority: form.get('priority'),
      responsible: form.get('responsible'),
      portalUrl: form.get('portalUrl'),
      actor: state.actor,
      catalogId: form.get('catalogId') || '',
      serviceMode: form.get('serviceMode') || 'Único',
      recurrence: form.get('recurrence') || '',
      recurrenceDays: form.get('recurrenceDays') || '',
      repeatAmount: form.get('repeatAmount') === 'on',
      removeAttachment: form.get('removeAttachment') === 'true',
      originDeviceId: PWA_DEVICE_ID
    };
    const attachment = itemAttachmentDraft;
    setBusy(els.saveItemButton, true);
    try {
      const result = await api('saveItem', payload);
      let attachmentError = '';
      if (attachment) {
        try {
          await api('uploadReceipt', { itemId: result.item.id, actor: state.actor, filename: attachment.filename, dataUrl: attachment.dataUrl });
        } catch (error) {
          attachmentError = `El pendiente se guardó, pero ${payload.type === 'Servicio' ? 'el comprobante' : 'la foto'} no: ${errorMessage(error)}`;
        }
      }
      closeSheets();
      toast(payload.id ? 'Pendiente actualizado.' : 'Pendiente guardado y compartido.');
      if (result.notificationMessage && !result.notificationSent) toast(result.notificationMessage);
      if (attachmentError) toast(attachmentError, 'error', 6500);
      await loadData();
    } catch (error) {
      toast(errorMessage(error), 'error', 6000);
    } finally {
      setBusy(els.saveItemButton, false);
    }
  }

    itemAttachmentSelectionId += 1;
    itemAttachmentDraft = null;
    itemAttachmentPreparing = false;
    itemOriginalType = item && item.type || 'Despensa';
    itemExistingAttachment = item && item.receiptUrl ? { url: item.receiptUrl, name: item.receiptName || 'Archivo actual' } : null;
    els.itemFile.value = '';
    $('#itemRemoveAttachment').value = 'false';
    els.itemAttachmentPreview.hidden = true;

    if (itemExistingAttachment && type === itemOriginalType) {
      $('#itemRemoveAttachment').value = 'false';
      showItemAttachmentPreview(
        itemExistingAttachment.url,
        itemExistingAttachment.name,

      );

  async function handleItemAttachmentSelection(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const selectionId = ++itemAttachmentSelectionId;
    const isService = checkedValue('type') === 'Servicio';
    itemAttachmentPreparing = true;
    els.saveItemButton.disabled = true;
    els.itemFileLabel.textContent = isService ? 'Preparando comprobante…' : 'Preparando foto…';
    try {
      let prepared;
      if (isService && file.type === 'application/pdf') {
        if (file.size > 5 * 1024 * 1024) throw new Error('El PDF debe pesar menos de 5 MB.');
        prepared = { dataUrl: await readFile(file), filename: file.name || 'comprobante.pdf', isImage: false };
      } else {
        prepared = await prepareCatalogImage(file);
        prepared.isImage = true;
      }
      if (selectionId !== itemAttachmentSelectionId) return;
      itemAttachmentDraft = prepared;
      $('#itemRemoveAttachment').value = 'false';
      showItemAttachmentPreview(
        prepared.isImage ? prepared.dataUrl : '',
        prepared.filename,
        prepared.isImage,
        isService ? 'Comprobante listo para guardar' : 'Foto lista para guardar'
      );
    } catch (error) {
      if (selectionId !== itemAttachmentSelectionId) return;
      event.target.value = '';
      toast(errorMessage(error), 'error', 6000);
    } finally {
      if (selectionId !== itemAttachmentSelectionId) return;
      itemAttachmentPreparing = false;
      els.saveItemButton.disabled = false;
      updateItemAttachmentControls();
    }

  function updateItemAttachmentControls() {

    $('#itemAttachmentTitle').innerHTML = isService

      : 'Foto del producto <span>opcional</span>';

    $('#itemAttachmentIconUse').setAttribute('href', isService ? '#i-upload' : '#i-camera');
    $('#itemAttachmentHelp').textContent = isService
      ? 'Puedes adjuntar una foto del recibo o un archivo PDF.'
      : 'Abre la cámara o elige una imagen de la galería.';
    const hasAttachment = !els.itemAttachmentPreview.hidden;
    els.itemFileLabel.textContent = hasAttachment
      ? (isService ? 'Cambiar comprobante' : 'Cambiar foto')
      : (isService ? 'Adjuntar foto o PDF' : 'Tomar o elegir foto');

    const payload = {
      homeName: form.get('homeName'), person1Name: form.get('person1Name'), person1Email: form.get('person1Email'),
      person2Name: form.get('person2Name'), person2Email: form.get('person2Email'),
      sendEmails: form.get('sendEmails') === 'on', actor: state.actor
    };

    const actionLabel = item.status === 'Completado' ? 'Reabrir pendiente' : item.type === 'Servicio' ? 'Marcar como pagado' : item.type === 'Despensa' ? 'Marcar como comprado' : 'Marcar como completado';
    const actionIcon = item.status === 'Completado' ? '↻' : '<svg class="icon"><use href="#i-check"/></svg>';
    const recurrenceCopy = item.type === 'Servicio' && item.serviceMode === 'Recurrente'

      : '';

    ${productPhotoUrl ? `<img class="detail-photo" src="${escapeAttr(productPhotoUrl)}" alt="Foto de ${escapeAttr(item.title)}">` : ''}
    ${item.detail ? `<p class="detail-description">${escapeHtml(item.detail)}</p>` : ''}

    <div class="detail-grid">

      <div class="detail-stat"><small>${item.type === 'Servicio' ? 'Monto' : 'Cantidad'}</small><strong>${item.type === 'Servicio' ? (item.amount === '' ? 'Sin monto' : currency(item.amount)) : (item.quantity === '' ? 'Sin cantidad' : number(item.quantity))}</strong></div>

      </div>
      ${item.portalUrl ? `<a class="secondary-button detail-link" href="${escapeAttr(item.portalUrl)}" target="_blank" rel="noopener"><svg class="icon"><use href="#i-external"/></svg> ${item.type === 'Servicio' ? 'Abrir portal de pago' : 'Abrir enlace de compra'}</a>` : ''}
      ${item.status === 'Pendiente' ? '<button class="text-button danger-text" type="button" data-detail-action="cancel">Cancelar este pendiente</button>' : ''}
    </div>`;

  async function handleDetailClick(event) {
    const button = event.target.closest('[data-detail-action]');
    if (!button) return;
    const item = findItem(state.selectedId);
    if (!item) return;
    const action = button.dataset.detailAction;
    if (action === 'close') return closeSheets();
    if (action === 'edit') {
      closeSheets();
      setTimeout(() => openForm(item), 100);
      return;
    }
    if (action === 'toggle') {
      const completing = item.status !== 'Completado';
      const accepted = await confirmAction(
        completing ? '¿Marcar como completado?' : '¿Reabrir este pendiente?',
        completing ? 'El cambio aparecerá en el historial compartido.' : 'Volverá a mostrarse en las listas pendientes.',
        completing ? 'Sí, completar' : 'Sí, reabrir'
      );
      if (!accepted) return;
      await changeStatus(item, completing ? 'Completado' : 'Pendiente', button);
    }
    if (action === 'cancel') {
      const accepted = await confirmAction('¿Cancelar este pendiente?', 'Se conservará en el historial, pero dejará de mostrarse como pendiente.', 'Sí, cancelar');
      if (accepted) await changeStatus(item, 'Cancelado', button);
    }
  }

  function openSheet(sheet) {
    $$('.bottom-sheet.is-open').forEach(open => {
      if (open !== sheet) { open.classList.remove('is-open'); open.setAttribute('aria-hidden', 'true'); }
    });
    els.overlay.hidden = false;
    sheet.setAttribute('aria-hidden', 'false');
    requestAnimationFrame(() => sheet.classList.add('is-open'));
    document.body.style.overflow = 'hidden';
  }

  function closeSheets() {
    $$('.bottom-sheet.is-open').forEach(sheet => {
      sheet.classList.remove('is-open');
      sheet.setAttribute('aria-hidden', 'true');
    });
    if (els.confirmDialog.hidden) els.overlay.hidden = true;
    document.body.style.overflow = '';
    if (state.remoteRefreshPending && els.confirmDialog.hidden) {
      state.remoteRefreshPending = false;
      setTimeout(() => loadData({ event: 'deferred-push' }), 80);
    }
  }

  function confirmAction(title, message, acceptLabel) {
    els.confirmTitle.textContent = title;
    els.confirmMessage.textContent = message;
    els.confirmAccept.textContent = acceptLabel;
    els.confirmDialog.hidden = false;
    els.overlay.hidden = false;
    setTimeout(() => els.confirmAccept.focus(), 30);
    return new Promise(resolve => { state.confirmResolve = resolve; });
  }

  function finishConfirm(value) {
    els.confirmDialog.hidden = true;
    if (!$('.bottom-sheet.is-open')) els.overlay.hidden = true;
    const resolve = state.confirmResolve;
    state.confirmResolve = null;
    if (resolve) resolve(value);
  }

  function validateActor() {
    const { person1Name, person2Name } = state.data.settings;
    if (![person1Name, person2Name].includes(state.actor)) state.actor = person1Name || person2Name || 'Axel';
    localStorage.setItem(STORAGE_ACTOR, state.actor);
  }

  async function handlePwaMessage(event) {
    const data = event.data;
    if (!PWA_CHANNEL || !data || typeof data !== 'object' || data.channel !== PWA_CHANNEL) return;
    if (event.source !== window.top && event.source !== window.parent) return;

    if (data.type === 'casa-en-orden:set-actor') {
      const people = [state.data.settings.person1Name, state.data.settings.person2Name];
      if (!people.includes(data.actor)) return;
      state.actor = data.actor;
      localStorage.setItem(STORAGE_ACTOR, state.actor);
      renderChrome();
      renderActorOptions();
      renderResponsibleChoices();
      postPwaState();
      return;
    }

    if (data.type === 'casa-en-orden:refresh') {
      requestFreshData('push');
      return;
    }

    if (data.type === 'casa-en-orden:open-new-item') {
      if (data.actor) {
        const people = [state.data.settings.person1Name, state.data.settings.person2Name];
        if (people.includes(data.actor)) state.actor = data.actor;
      }
      renderChrome();
      renderActorOptions();
      renderResponsibleChoices();
      openForm();
      return;
    }

    if (data.type === 'casa-en-orden:open-item') {
      if (data.itemId && findItem(data.itemId)) openDetail(data.itemId);
      return;
    }

    if (data.type === 'casa-en-orden:open-view') {
      if (['home', 'pending', 'history', 'profile'].includes(data.view)) navigate(data.view);
      return;
    }

    if (data.type === 'casa-en-orden:configure-push-bridge') {
      try {
        const result = await api('configurarPuentePushPWA', {
          notifyUrl: data.notifyUrl,
          notifySecret: data.notifySecret,
          appAccessToken: data.appAccessToken,
          pwaUrl: data.pwaUrl
        });
        PWA_ACCESS_TOKEN = String(data.appAccessToken || '');
        PWA_DEVICE_ID = String(data.deviceId || '');
        PWA_DEVICE_OWNER = String(data.deviceOwner || '');
        const firstAuthentication = !state.authenticated;
        state.authenticated = true;
        postToPwa({ type: 'casa-en-orden:bridge-result', ok: Boolean(result && result.ok) });
        if (firstAuthentication) await loadData({ initial: true });
      } catch (error) {
        postToPwa({ type: 'casa-en-orden:bridge-result', ok: false, error: errorMessage(error) });
      }
    }
  }

  function postPwaState() {
    if (!PWA_CHANNEL) return;
    const settings = state.data.settings || {};
    postToPwa({
      type: 'casa-en-orden:state',
      actor: state.actor,
      people: [settings.person1Name, settings.person2Name].filter(Boolean),
      homeName: settings.homeName || 'Casa en Orden',
      pushConfigured: Boolean(state.data.pushConfigured)
    });
  }

  function postToPwa(message) {
    if (!PWA_CHANNEL) return;
    try {
      window.top.postMessage(Object.assign({}, message, { channel: PWA_CHANNEL }), '*');
    } catch (error) {
      console.warn('No se pudo comunicar con la PWA.', error);
    }
  }

  function showLockedState() {
    const title = $('strong', els.loading);
    if (title) title.textContent = 'Abre Casa en Orden desde el icono instalado';
    const detail = document.createElement('small');
    detail.textContent = 'Esta dirección de Apps Script está protegida. Usa la URL de Cloudflare para vincular el teléfono con el PIN del hogar.';
    detail.style.maxWidth = '320px';
    detail.style.textAlign = 'center';
    detail.style.color = '#6f756f';
    els.loading.appendChild(detail);
  }

  function requestFreshData(source) {
    if (!state.authenticated || state.syncing) return;
    if ($('.bottom-sheet.is-open') || !els.confirmDialog.hidden || state.settingsDirty) {
      state.remoteRefreshPending = true;
      if (source === 'push') toast('Hay cambios nuevos. Se actualizarán al cerrar esta ventana.');
      return;
    }
    state.remoteRefreshPending = false;
    loadData({ event: source });
  }

  function showSync(message, syncing = false) {
    els.syncText.textContent = message;
    els.syncPill.classList.toggle('is-syncing', syncing);
    els.syncPill.hidden = false;
    clearTimeout(showSync.timer);
    showSync.timer = setTimeout(() => { if (!state.syncing) els.syncPill.hidden = true; }, syncing ? 8000 : 1800);
  }

  function toast(message, type = '', duration = 3600) {
    if (!message) return;
    const element = document.createElement('div');
    element.className = `toast ${type}`;
    element.textContent = message;
    els.toastRegion.appendChild(element);
    setTimeout(() => element.remove(), duration);
  }

  function setBusy(element, busy) {
    if (!element) return;
    element.disabled = busy;
    element.classList.toggle('button-loading', busy);
  }

  function setRadio(name, value) {
    const input = els.itemForm.querySelector(`input[name="${name}"][value="${cssEscape(value)}"]`);
    if (input) input.checked = true;
  }

  function checkedValue(name) {
    const input = els.itemForm.querySelector(`input[name="${name}"]:checked`);
    return input ? input.value : '';
  }

  function findItem(id) { return state.data.items.find(item => item.id === id); }
  function findCatalogEntry(id) { return (state.data.catalog || []).find(entry => entry.id === id); }
  function isImageFilename(value) { return /\.(?:jpe?g|png|webp)$/i.test(String(value || '')); }
  function itemProductPhotoUrl(item) {
    if (!item || item.type === 'Servicio') return '';
    if (item.receiptUrl && (isImageFilename(item.receiptName) || /drive\.google\.com\/thumbnail/i.test(item.receiptUrl))) {
      return item.receiptUrl;
    }
    const catalogEntry = findCatalogEntry(item.catalogId);
    return catalogEntry && catalogEntry.imageUrl || '';
  }
  function catalogThumbnail(entry) {
    return entry && entry.imageUrl
      ? `<span class="catalog-thumb"><img src="${escapeAttr(entry.imageUrl)}" alt="" loading="lazy"></span>`
      : '<span class="catalog-thumb">📦</span>';
  }
  function catalogEntryDescription(entry) {
    if (entry.description) return String(entry.description).slice(0, 500);
    const values = [entry.name, entry.brand, entry.model, entry.specification, entry.presentation, entry.location ? `Ubicación: ${entry.location}` : ''];
    return [...new Set(values.filter(Boolean))].join(' · ').slice(0, 500);
  }
  function catalogSearchScore(entry, query) {
    if (!query) return 0;
    const name = normalizeText(entry.alias);
    const description = normalizeText(catalogEntryDescription(entry));
    const searchable = `${name} ${description}`.trim();
    const terms = query.split(/\s+/).filter(Boolean);
    if (!terms.every(term => searchable.includes(term))) return -1;
    if (name === query) return 1000;
    if (name.startsWith(query)) return 800;
    if (name.includes(query)) return 600;
    return 300 + terms.reduce((score, term) => score + (name.includes(term) ? 20 : 5), 0);
  }
  function prioritySort(a, b) {
    if (a.priority !== b.priority) return a.priority === 'Urgente' ? -1 : 1;
    if (a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate);
    if (a.dueDate) return -1;
    if (b.dueDate) return 1;
    return String(b.updatedAt).localeCompare(String(a.updatedAt));
  }
  function typeIcon(type) { return ({ Despensa: '🛒', Servicio: '🧾', 'Reparación': '🔧', Otro: '🏠' })[type] || '🏠'; }
  function initials(name) { return String(name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(part => part[0]).join('').toUpperCase(); }
  function firstName(name) { return String(name || '').trim().split(/\s+/)[0] || 'Hola'; }
  function number(value) { return new Intl.NumberFormat('es-MX', { maximumFractionDigits: 2 }).format(Number(value) || 0); }
  function currency(value) { return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 2 }).format(Number(value) || 0); }
  function parseDate(value) {
    if (!value) return null;
    const match = String(value).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return match ? new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3])) : null;
  }
  function daysUntil(value) {
    const date = parseDate(value);
    if (!date) return 9999;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    return Math.round((date - today) / 86400000);
  }
  function dueLabel(value) {
    if (!value) return '';
    const days = daysUntil(value);
    if (days < 0) return `Venció hace ${Math.abs(days)} ${Math.abs(days) === 1 ? 'día' : 'días'}`;
    if (days === 0) return 'Vence hoy';
    if (days === 1) return 'Vence mañana';
    return `Vence ${shortDate(value)}`;
  }
  function shortDate(value) {
    const date = parseDate(value);
    return date ? new Intl.DateTimeFormat('es-MX', { day: 'numeric', month: 'short' }).format(date).replace('.', '') : '';
  }
  function longDate(value) {
    const date = parseDate(value);
    return date ? new Intl.DateTimeFormat('es-MX', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }).format(date).replace(/\./g, '') : '';
  }
  function relativeTime(value) {
    const date = new Date(value);
    if (isNaN(date)) return '';
    const seconds = Math.round((Date.now() - date.getTime()) / 1000);
    if (seconds < 45) return 'Ahora';
    if (seconds < 3600) return `Hace ${Math.floor(seconds / 60)} min`;
    if (seconds < 86400) return `Hace ${Math.floor(seconds / 3600)} h`;
    if (seconds < 604800) return `Hace ${Math.floor(seconds / 86400)} d`;
    return new Intl.DateTimeFormat('es-MX', { day: 'numeric', month: 'short', year: 'numeric' }).format(date).replace(/\./g, '');
  }
  function normalizeText(value) { return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
  function escapeHtml(value) { return String(value == null ? '' : value).replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[char]); }
  function escapeAttr(value) { return escapeHtml(value).replace(/`/g, '&#96;'); }
  function cssEscape(value) { return window.CSS && CSS.escape ? CSS.escape(String(value)) : String(value).replace(/["\\]/g, '\\$&'); }
  function errorMessage(error) { return error && (error.message || error.toString()) || 'Ocurrió un error inesperado.'; }
  function readFile(file) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = () => reject(new Error('No pudimos leer el archivo.')); reader.readAsDataURL(file); }); }

  async function prepareCatalogImage(file) {
    if (file.type && !file.type.startsWith('image/')) throw new Error('Selecciona una imagen de la cámara o la galería.');
    if (file.size > 30 * 1024 * 1024) throw new Error('La foto original es demasiado grande. Intenta tomarla con una resolución menor.');
    const image = await loadLocalImage(file);
    const attempts = [
      { maxDimension: 1600, quality: .82 },
      { maxDimension: 1280, quality: .76 },
      { maxDimension: 1000, quality: .70 }
    ];
    for (const attempt of attempts) {
      const blob = await renderCatalogImageBlob(image, attempt.maxDimension, attempt.quality);
      if (blob.size <= 4 * 1024 * 1024) {
        return {
          dataUrl: await readFile(blob),
          filename: catalogImageFilename(file.name),
          size: blob.size
        };
      }
    }
    throw new Error('No pudimos reducir la foto lo suficiente. Elige otra imagen.');
  }

  function loadLocalImage(file) {
    return new Promise((resolve, reject) => {
      const source = URL.createObjectURL(file);
      const image = new Image();
      image.onload = () => { URL.revokeObjectURL(source); resolve(image); };
      image.onerror = () => {
        URL.revokeObjectURL(source);
        reject(new Error('No pudimos abrir esa foto. Prueba con una imagen JPG, PNG o WEBP.'));
      };
      image.src = source;
    });
  }

  function renderCatalogImageBlob(image, maxDimension, quality) {
    const width = Number(image.naturalWidth || image.width);
    const height = Number(image.naturalHeight || image.height);
    if (!width || !height) return Promise.reject(new Error('La foto no tiene dimensiones válidas.'));
    const scale = Math.min(1, maxDimension / Math.max(width, height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(width * scale));
    canvas.height = Math.max(1, Math.round(height * scale));
    const context = canvas.getContext('2d');
    context.fillStyle = '#fff';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(image, 0, 0, canvas.width, canvas.height);
    return new Promise((resolve, reject) => canvas.toBlob(
      blob => blob ? resolve(blob) : reject(new Error('No pudimos preparar la foto.')),
      'image/jpeg',
      quality
    ));
  }

  function catalogImageFilename(value) {
    const base = String(value || 'foto-producto')
      .replace(/\.[^.]+$/, '')
      .replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ _-]/g, '_')
      .trim()
      .slice(0, 90) || 'foto-producto';
    return `${base}.jpg`;
  }

  function api(method, ...args) {
    if (DEMO_MODE) return demoApi(method, ...args);
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)[method](...args, PWA_ACCESS_TOKEN);
    });
  }

  function demoApi(method, ...args) {
    return new Promise((resolve, reject) => {
      setTimeout(() => {
        try {
          const data = demoData();
          if (method === 'getBootstrapData') return resolve(structuredCloneSafe(data));
          if (method === 'saveItem') {
            const payload = args[0];
            let item = data.items.find(entry => entry.id === payload.id);
            const now = new Date().toISOString();
            const cleanPayload = { ...payload };
            delete cleanPayload.removeAttachment;
            if (item) {
              if (payload.removeAttachment) {
                item.receiptUrl = '';
                item.receiptName = '';
              }
              Object.assign(item, cleanPayload, { updatedAt: now });
            }
            else {
              item = Object.assign({}, cleanPayload, { id: `HOG-${Math.random().toString(16).slice(2, 10).toUpperCase()}`, status: 'Pendiente', createdBy: payload.actor, createdAt: now, updatedAt: now, completedBy: '', completedAt: '', receiptUrl: '', receiptName: '' });
              data.items.unshift(item);
            }
            demoActivity(data, item.id, payload.id ? 'Editó' : 'Agregó', `${payload.id ? 'Editó' : 'Agregó'} ${item.title}`, payload.actor);
            saveDemo(data); return resolve({ ok: true, item, notificationSent: false, notificationMessage: 'Modo de demostración: los avisos por correo están desactivados.' });
          }
          if (method === 'setItemStatus') {
            const [id, status, actor] = args; const item = data.items.find(entry => entry.id === id); if (!item) throw new Error('El pendiente ya no existe.');
            item.status = status; item.updatedAt = new Date().toISOString(); item.completedBy = status === 'Completado' ? actor : ''; item.completedAt = status === 'Completado' ? item.updatedAt : '';
            let nextItem = null;
            if (status === 'Completado' && item.type === 'Servicio' && item.serviceMode === 'Recurrente') {
              nextItem = { ...item, id:`HOG-${Math.random().toString(16).slice(2, 10).toUpperCase()}`, status:'Pendiente', amount:item.repeatAmount ? item.amount : '', dueDate:demoNextDate(item.dueDate, item.recurrence, item.recurrenceDays), createdBy:'Casa en Orden', createdAt:item.updatedAt, completedBy:'', completedAt:'', receiptUrl:'', receiptName:'', previousItemId:item.id };
              data.items.unshift(nextItem);
            }
            const verb = status === 'Completado' ? 'Completó' : status === 'Cancelado' ? 'Canceló' : 'Reabrió'; demoActivity(data, id, verb, `${verb} ${item.title}`, actor); saveDemo(data); return resolve({ ok: true, item, nextItem });
          }
          if (method === 'uploadReceipt') {
            const payload = args[0]; const item = data.items.find(entry => entry.id === payload.itemId); if (!item) throw new Error('No encontramos el pendiente.');
            item.receiptName = payload.filename; item.receiptUrl = payload.dataUrl; item.updatedAt = new Date().toISOString(); demoActivity(data, item.id, 'Adjuntó', `Adjuntó ${payload.filename} a ${item.title}`, payload.actor); saveDemo(data); return resolve({ ok: true, item });
          }
          if (method === 'saveSettings') {
            const payload = args[0]; data.settings = { homeName: payload.homeName, person1Name: payload.person1Name, person1Email: payload.person1Email, person2Name: payload.person2Name, person2Email: payload.person2Email, sendEmails: payload.sendEmails }; saveDemo(data); return resolve({ ok: true, settings: data.settings });
          }
          if (method === 'saveCatalogEntry') {
            const payload = args[0]; let entry = data.catalog.find(current => current.id === payload.id); const now = new Date().toISOString();
            if (entry) Object.assign(entry, payload, { updatedAt: now });
            else { entry = { ...payload, id:`CAT-${Math.random().toString(16).slice(2, 10).toUpperCase()}`, active:true, updatedAt:now }; data.catalog.push(entry); }
            saveDemo(data); return resolve({ ok:true, entry });
          }
          if (method === 'uploadCatalogImage') {
            const payload = args[0]; const entry = data.catalog.find(current => current.id === payload.catalogId); if (!entry) throw new Error('El producto ya no existe en el catálogo.');
            entry.imageUrl = payload.dataUrl; entry.updatedAt = new Date().toISOString(); saveDemo(data); return resolve({ ok:true, entry });
          }
          if (method === 'setCatalogEntryActive') {
            const [id, active] = args; const entry = data.catalog.find(current => current.id === id); if (!entry) throw new Error('El producto ya no existe en el catálogo.');
            entry.active = Boolean(active); entry.updatedAt = new Date().toISOString(); saveDemo(data); return resolve({ ok:true, entry });
          }
          throw new Error(`Método no disponible en demo: ${method}`);
        } catch (error) { reject(error); }
      }, method === 'getBootstrapData' ? 350 : 500);
    });
  }

  function demoData() {
    const stored = localStorage.getItem(STORAGE_DEMO);
    if (stored) {
      try {
        const parsed = JSON.parse(stored);
        if (!Array.isArray(parsed.catalog)) parsed.catalog = [];
        return parsed;
      } catch (error) { localStorage.removeItem(STORAGE_DEMO); }
    }
    const now = new Date();
    const iso = days => { const date = new Date(now); date.setDate(date.getDate() + days); return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; };
    const timestamp = minutes => new Date(now.getTime() - minutes * 60000).toISOString();
    const data = {
      settings: { homeName: 'Casa en Orden', person1Name: 'Axel', person1Email: '', person2Name: 'Laura', person2Email: '', sendEmails: false },
      items: [
        { id:'HOG-1001', type:'Servicio', title:'Luz', detail:'Recibo bimestral', quantity:1, amount:620, dueDate:iso(4), priority:'Urgente', responsible:'Axel', createdBy:'Laura', status:'Pendiente', portalUrl:'https://www.cfe.mx/', receiptUrl:'', receiptName:'', createdAt:timestamp(180), updatedAt:timestamp(5), completedBy:'', completedAt:'', serviceMode:'Recurrente', recurrence:'Bimestral', recurrenceDays:'', repeatAmount:false, seriesId:'SER-LUZ', previousItemId:'', catalogId:'' },
        { id:'HOG-1002', type:'Servicio', title:'Internet', detail:'Mensualidad', quantity:1, amount:549, dueDate:iso(8), priority:'Normal', responsible:'Axel', createdBy:'Axel', status:'Pendiente', portalUrl:'', receiptUrl:'', receiptName:'', createdAt:timestamp(300), updatedAt:timestamp(60), completedBy:'', completedAt:'', serviceMode:'Recurrente', recurrence:'Mensual', recurrenceDays:'', repeatAmount:true, seriesId:'SER-INTERNET', previousItemId:'', catalogId:'' },
        { id:'HOG-1003', type:'Despensa', title:'Papel higiénico', detail:'Comprar dos paquetes', quantity:2, amount:'', dueDate:'', priority:'Urgente', responsible:'Axel', createdBy:'Laura', status:'Pendiente', portalUrl:'', receiptUrl:'', receiptName:'', createdAt:timestamp(10), updatedAt:timestamp(5), completedBy:'', completedAt:'' },
        { id:'HOG-1004', type:'Despensa', title:'Café y jabón de trastes', detail:'', quantity:1, amount:'', dueDate:'', priority:'Normal', responsible:'Axel', createdBy:'Laura', status:'Pendiente', portalUrl:'', receiptUrl:'', receiptName:'', createdAt:timestamp(90), updatedAt:timestamp(80), completedBy:'', completedAt:'' },
        { id:'HOG-1005', type:'Reparación', title:'Lámpara de la recámara', detail:'Comprar foco cálido, base E27', quantity:1, amount:'', dueDate:'', priority:'Normal', responsible:'Axel', createdBy:'Laura', status:'Pendiente', portalUrl:'', receiptUrl:'', receiptName:'', createdAt:timestamp(240), updatedAt:timestamp(120), completedBy:'', completedAt:'' },
        { id:'HOG-1006', type:'Despensa', title:'Huevos', detail:'', quantity:1, amount:'', dueDate:'', priority:'Normal', responsible:'Axel', createdBy:'Laura', status:'Completado', portalUrl:'', receiptUrl:'', receiptName:'', createdAt:timestamp(500), updatedAt:timestamp(70), completedBy:'Axel', completedAt:timestamp(70) }
      ],
      catalog: [
        { id:'CAT-FOCO', alias:'Foco del cuarto', category:'Reparación', location:'Recámara', name:'Foco LED', brand:'Philips', model:'A60', specification:'9 W · E27 · 3000 K · luz cálida', presentation:'1 pieza', imageUrl:'', purchaseUrl:'', active:true, updatedAt:timestamp(200) },
        { id:'CAT-PAPEL', alias:'Papel de baño', category:'Despensa', location:'Baño', name:'Papel higiénico', brand:'', model:'', specification:'Doble hoja', presentation:'Paquete de 12 rollos', imageUrl:'', purchaseUrl:'', active:true, updatedAt:timestamp(190) }
      ],
      activity: [
        { id:'ACT-1', itemId:'HOG-1003', action:'Agregó', description:'Agregó Papel higiénico', actor:'Laura', date:timestamp(5) },
        { id:'ACT-2', itemId:'HOG-1002', action:'Completó', description:'Pagó Internet', actor:'Axel', date:timestamp(60) },
        { id:'ACT-3', itemId:'HOG-1005', action:'Agregó', description:'Agregó Lámpara de la recámara', actor:'Laura', date:timestamp(120) }
      ], serverTime: now.toISOString()
    };
    saveDemo(data); return data;
  }
  function demoActivity(data, itemId, action, description, actor) { data.activity.unshift({ id:`ACT-${Date.now()}`, itemId, action, description, actor, date:new Date().toISOString() }); }
  function demoNextDate(value, recurrence, customDays) {
    const date = parseDate(value) || new Date();
    const days = ({ Semanal:7, Quincenal:15, Personalizada:Number(customDays) || 1 })[recurrence];
    if (days) date.setDate(date.getDate() + days);
    else date.setMonth(date.getMonth() + (({ Mensual:1, Bimestral:2, Trimestral:3, Semestral:6, Anual:12 })[recurrence] || 1));
    return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  }
  function saveDemo(data) { localStorage.setItem(STORAGE_DEMO, JSON.stringify(data)); }
  function structuredCloneSafe(data) { return JSON.parse(JSON.stringify(data)); }
})();
</script>
