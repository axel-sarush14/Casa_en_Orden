<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f6f6f4;
    --surface-3: #eeeeeb;
    --text: #272823;
    --muted: #72736c;
    --line: #e2e2de;
    --sage: #4f6f52;
    --sage-dark: #3e5941;
    --sage-soft: #e9efe6;
    --clay: #b9543d;
    --clay-dark: #a94834;
    --clay-soft: #fae9e4;
    --gold: #b98b44;
    --gold-soft: #f5ead6;
    --shadow: 0 14px 38px rgba(35, 35, 30, .10);
    --shadow-soft: 0 8px 20px rgba(35, 35, 30, .07);
    --radius-xl: 24px;
    --radius-lg: 18px;
    --radius-md: 14px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
    font-family: Inter, ui-rounded, "SF Pro Rounded", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html { min-height: 100%; background: var(--bg); scroll-behavior: smooth; }
  body {
    min-height: 100%;
    margin: 0;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  button, input, textarea, select { font: inherit; }
  button { color: inherit; }
  button, label, select { -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 3px solid rgba(79, 111, 82, .22);
    outline-offset: 2px;
  }
  [hidden] { display: none !important; }
  .svg-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
  .icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .icon-sm { width: 16px; height: 16px; }
  .icon-xs { width: 14px; height: 14px; }

  .loading-screen {
    position: fixed; inset: 0; z-index: 100;
    display: grid; place-content: center; justify-items: center; gap: 18px;
    background: var(--bg); color: var(--sage-dark);
  }
  .loading-mark { display: flex; align-items: end; gap: 5px; height: 34px; }
  .loading-mark span { width: 9px; border-radius: 10px; background: var(--sage); animation: loadingBars 1s ease-in-out infinite; }
  .loading-mark span:nth-child(1) { height: 16px; animation-delay: -.2s; }
  .loading-mark span:nth-child(2) { height: 30px; }
  .loading-mark span:nth-child(3) { height: 22px; animation-delay: .2s; }
  @keyframes loadingBars { 0%, 100% { transform: scaleY(.7); opacity: .6; } 50% { transform: scaleY(1); opacity: 1; } }

  .app { width: min(100%, 940px); min-height: 100dvh; margin: 0 auto; }
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    min-height: calc(76px + var(--safe-top));
    padding: calc(13px + var(--safe-top)) 18px 12px;
    background: rgba(255, 255, 255, .94);
    border-bottom: 1px solid rgba(226, 226, 222, .85);
    backdrop-filter: blur(14px);
  }
  .topbar h1 { margin: 1px 0 0; font-size: clamp(20px, 5vw, 25px); letter-spacing: -.04em; }
  .eyebrow, .section-kicker { margin: 0; color: var(--muted); font-size: 11px; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; }
  .actor-button {
    display: flex; align-items: center; gap: 7px; min-height: 44px; padding: 5px 9px 5px 5px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer;
    box-shadow: 0 3px 10px rgba(35, 35, 30, .04); font-size: 13px; font-weight: 700;
  }
  .actor-button .icon { transform: rotate(90deg); color: var(--muted); }
  .avatar {
    display: inline-grid; place-items: center; flex: 0 0 auto;
    width: 34px; height: 34px; border-radius: 50%;
    color: #fff; background: var(--sage); font-size: 14px; font-weight: 800;
  }
  .avatar-clay { background: var(--clay); }
  .avatar-sage { background: var(--sage); }
  .avatar-small { width: 27px; height: 27px; font-size: 11px; }

  .main-content { padding: 20px 16px calc(108px + var(--safe-bottom)); }
  .view { display: none; animation: viewIn .22s ease-out; }
  .view.is-active { display: block; }
  @keyframes viewIn { from { opacity: .25; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  h2, h3, p { overflow-wrap: anywhere; }
  h2 { margin: 2px 0 0; font-size: clamp(22px, 6vw, 30px); letter-spacing: -.045em; line-height: 1.15; }
  h3 { margin: 2px 0 0; font-size: 18px; letter-spacing: -.025em; }
  .greeting { margin: 0 0 2px; font-size: clamp(25px, 7vw, 34px); font-weight: 800; line-height: 1.1; letter-spacing: -.05em; }
  .welcome-row, .page-heading, .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .welcome-row { margin: 3px 0 20px; }
  .page-heading { margin: 4px 0 18px; }
  .section-heading { margin: 25px 1px 11px; }
  .icon-button {
    display: inline-grid; place-items: center; flex: 0 0 auto; width: 44px; height: 44px;
    border: 1px solid var(--line); border-radius: 50%; background: var(--surface); cursor: pointer;
  }
  .icon-button.is-spinning .icon { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .text-button { border: 0; padding: 8px 0 8px 10px; background: transparent; color: var(--sage-dark); font-size: 13px; font-weight: 750; cursor: pointer; }
  .primary-small { border: 0; border-radius: 999px; padding: 10px 16px; background: var(--sage); color: #fff; font-weight: 750; cursor: pointer; }

  .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
  .summary-card {
    min-width: 0; padding: 13px 10px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-soft);
  }
  .summary-icon { display: grid; place-items: center; width: 30px; height: 30px; margin-bottom: 8px; border-radius: 10px; background: var(--sage-soft); color: var(--sage); font-size: 15px; }
  .summary-card.urgent .summary-icon { background: var(--clay-soft); color: var(--clay); }
  .summary-card.due .summary-icon { background: var(--gold-soft); color: var(--gold); }
  .summary-number { display: block; font-size: 23px; font-weight: 850; letter-spacing: -.05em; line-height: 1; }
  .summary-label { display: block; margin-top: 4px; color: var(--muted); font-size: 10.5px; line-height: 1.2; }

  .stack-list, .pending-list { display: grid; gap: 9px; }
  .item-card {
    position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 11px;
    width: 100%; min-height: 72px; padding: 12px; text-align: left;
    border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); cursor: pointer;
    box-shadow: 0 4px 12px rgba(35, 35, 30, .035);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .item-card:active { transform: scale(.988); }
  .item-card.is-completed { opacity: .68; background: var(--sage-soft); }
  .item-card.is-completed .item-title { text-decoration: line-through; }
  .item-icon {
    display: grid; place-items: center; flex: 0 0 auto; width: 42px; height: 42px;
    border-radius: 14px; background: var(--gold-soft); font-size: 20px;
  }
  .item-icon.service { background: var(--sage-soft); }
  .item-icon.repair { background: var(--surface-3); }
  .item-icon.other { background: #f1eff6; }
  .item-copy { min-width: 0; }
  .item-title { display: block; font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 7px; margin-top: 4px; color: var(--muted); font-size: 12px; }
  .item-amount { display: block; margin-top: 1px; font-size: 14px; font-weight: 850; }
  .item-end { display: grid; justify-items: end; gap: 7px; }
  .chevron { color: #989990; }
  .status-badge { display: inline-flex; align-items: center; min-height: 24px; padding: 4px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-size: 10.5px; font-weight: 750; white-space: nowrap; }
  .status-badge.urgent { background: var(--clay); color: #fff; }
  .status-badge.due-soon { background: var(--gold-soft); color: #775420; }
  .status-badge.complete { background: var(--sage); color: #fff; }
  .quick-action {
    min-width: 67px; min-height: 34px; padding: 7px 10px; border: 1px solid var(--sage); border-radius: 10px;
    background: transparent; color: var(--sage-dark); font-size: 12px; font-weight: 800; cursor: pointer;
  }

  .search-field {
    display: flex; align-items: center; gap: 10px; margin-bottom: 13px; padding: 0 13px;
    border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); color: var(--muted);
  }
  .search-field input { width: 100%; min-height: 48px; border: 0; outline: 0; background: transparent; color: var(--text); }
  .filter-chips { display: flex; gap: 8px; margin: 0 -16px 16px; padding: 0 16px 3px; overflow-x: auto; scrollbar-width: none; }
  .filter-chips::-webkit-scrollbar { display: none; }
  .filter-chip { flex: 0 0 auto; min-height: 38px; padding: 8px 13px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; }
  .filter-chip.is-active { border-color: var(--sage); background: var(--sage); color: #fff; }
  .pending-list .item-card { min-height: 82px; }

  .empty-state { display: grid; justify-items: center; gap: 8px; padding: 30px 18px; border: 1px dashed #d9d9d5; border-radius: var(--radius-lg); background: #fafaf9; text-align: center; }
  .empty-icon { display: grid; place-items: center; width: 54px; height: 54px; border-radius: 18px; background: var(--sage-soft); font-size: 25px; }
  .empty-state strong { font-size: 16px; }
  .empty-state p { max-width: 330px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
  .empty-state .primary-small { margin-top: 5px; }

  .timeline { position: relative; display: grid; gap: 0; }
  .timeline::before { content: ""; position: absolute; top: 20px; bottom: 20px; left: 19px; width: 1px; background: var(--line); }
  .timeline-item { position: relative; display: grid; grid-template-columns: 40px 1fr; gap: 12px; padding: 10px 0; }
  .timeline-avatar { position: relative; z-index: 1; display: grid; place-items: center; width: 40px; height: 40px; border: 5px solid var(--bg); border-radius: 50%; background: var(--sage); color: #fff; font-size: 11px; font-weight: 850; }
  .timeline-avatar.clay { background: var(--clay); }
  .timeline-card { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
  .timeline-card p { margin: 0; font-size: 14px; line-height: 1.35; }
  .timeline-card small { display: block; margin-top: 5px; color: var(--muted); }

  .settings-card { display: grid; gap: 18px; padding: 17px; border: 1px solid var(--line); border-radius: var(--radius-xl); background: var(--surface); box-shadow: var(--shadow-soft); }
  .people-settings { display: grid; gap: 14px; }
  .person-setting { display: grid; grid-template-columns: auto 1fr; align-items: end; gap: 9px 11px; padding: 13px; border-radius: var(--radius-lg); background: var(--surface-2); }
  .person-setting .full { grid-column: 1 / -1; }
  .grow { min-width: 0; }
  .field { display: grid; gap: 7px; }
  .field label, fieldset legend { color: var(--text); font-size: 13px; font-weight: 750; }
  .field label span, fieldset legend span { color: var(--muted); font-size: 11px; font-weight: 500; }
  input, textarea, select {
    width: 100%; min-height: 48px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 12px;
    background: #fff; color: var(--text); outline: 0; transition: border-color .15s ease, box-shadow .15s ease;
  }
  textarea { min-height: 84px; resize: vertical; }
  input:focus, textarea:focus, select:focus { border-color: var(--sage); box-shadow: 0 0 0 3px rgba(79,111,82,.10); }
  .toggle-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 14px; cursor: pointer; }
  .toggle-row strong, .toggle-row small { display: block; }
  .toggle-row small { margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.35; }
  .toggle-row input { position: absolute; opacity: 0; pointer-events: none; }
  .toggle { position: relative; width: 48px; height: 28px; border-radius: 999px; background: #cbc8c0; transition: background .2s; }
  .toggle::after { content: ""; position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,.15); transition: transform .2s; }
  .toggle-row input:checked + .toggle { background: var(--sage); }
  .toggle-row input:checked + .toggle::after { transform: translateX(20px); }
  .privacy-note { margin: -3px 0 0; color: var(--muted); font-size: 11px; line-height: 1.45; text-align: center; }
  .device-settings-button { justify-content: flex-start; text-align: left; }
  .device-settings-button > span { display: block; }
  .device-settings-button strong, .device-settings-button small { display: block; }
  .device-settings-button small { margin-top: 3px; color: var(--muted); font-size: 11px; font-weight: 500; }
  .catalog-settings-card { margin-top: 16px; padding: 17px; border: 1px solid var(--line); border-radius: var(--radius-xl); background: var(--surface); box-shadow: var(--shadow-soft); }
  .catalog-heading { margin: 0 0 8px; }
  .catalog-intro { margin: 0 0 14px; color: var(--muted); font-size: 12px; line-height: 1.5; }
  .catalog-list { display: grid; gap: 8px; }
  .catalog-card { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 11px; width: 100%; padding: 11px; border: 1px solid var(--line); border-radius: 14px; background: #fff; text-align: left; cursor: pointer; }
  .catalog-card.is-inactive { opacity: .56; background: var(--surface-2); }
  .catalog-thumb { display: grid; width: 42px; height: 42px; place-items: center; overflow: hidden; border-radius: 13px; background: var(--sage-soft); font-size: 19px; }
  .catalog-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .catalog-card-copy { min-width: 0; }
  .catalog-card-copy strong { display: block; overflow: hidden; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
  .catalog-card-copy small { display: block; margin-top: 3px; overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }

  .primary-button, .secondary-button {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 52px; padding: 12px 18px; border-radius: 14px; font-weight: 800; cursor: pointer;
  }
  .primary-button { border: 1px solid var(--sage); background: var(--sage); color: #fff; box-shadow: 0 7px 16px rgba(79,111,82,.17); }
  .primary-button:hover { background: var(--sage-dark); }
  .secondary-button { border: 1px solid var(--line); background: var(--surface); color: var(--text); }
  button:disabled { opacity: .55; cursor: wait; }
  .button-loading::after { content: ""; width: 17px; height: 17px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }

  .bottom-nav {
    position: fixed; z-index: 25; left: 50%; bottom: 0; transform: translateX(-50%);
    display: grid; grid-template-columns: repeat(4, 1fr); width: min(100%, 940px);
    padding: 7px 8px calc(7px + var(--safe-bottom)); border-top: 1px solid var(--line);
    background: rgba(255, 255, 255, .97); backdrop-filter: blur(16px);
  }
  .nav-item { display: grid; justify-items: center; gap: 3px; min-height: 51px; padding: 5px 3px; border: 0; background: transparent; color: #777970; font-size: 10px; cursor: pointer; }
  .nav-item .icon { width: 21px; height: 21px; }
  .nav-item.is-active { color: var(--sage); font-weight: 800; }
  .nav-item.is-active .icon { fill: currentColor; stroke-width: 1.3; }
  .fab {
    position: fixed; z-index: 26; right: max(18px, calc((100vw - 940px) / 2 + 18px)); bottom: calc(78px + var(--safe-bottom));
    display: grid; place-items: center; width: 54px; height: 54px; border: 0; border-radius: 18px;
    background: var(--sage); color: #fff; cursor: pointer; box-shadow: 0 10px 24px rgba(60,82,61,.32);
  }
  .fab .icon { width: 27px; height: 27px; }

  .sync-pill {
    position: fixed; z-index: 80; left: 50%; top: calc(13px + var(--safe-top)); transform: translateX(-50%);
    display: flex; align-items: center; gap: 7px; max-width: calc(100% - 32px); padding: 8px 12px;
    border: 1px solid #d8e3d4; border-radius: 999px; background: rgba(250,253,248,.97); color: var(--sage-dark);
    box-shadow: var(--shadow-soft); font-size: 11px; font-weight: 750;
  }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sage); }
  .sync-pill.is-syncing .sync-dot { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; transform: scale(.7); } }
  .toast-region { position: fixed; z-index: 110; left: 50%; bottom: calc(94px + var(--safe-bottom)); display: grid; gap: 8px; width: min(calc(100% - 28px), 420px); transform: translateX(-50%); pointer-events: none; }
  .toast { padding: 12px 15px; border-radius: 13px; background: #2f312c; color: #fff; box-shadow: var(--shadow); font-size: 13px; line-height: 1.4; animation: toastIn .22s ease-out; }
  .toast.error { background: #923d2e; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } }

  .overlay { position: fixed; z-index: 50; inset: 0; background: rgba(30,30,26,.44); backdrop-filter: blur(2px); animation: fadeIn .2s ease; }
  @keyframes fadeIn { from { opacity: 0; } }
  .bottom-sheet {
    position: fixed; z-index: 60; left: 50%; bottom: 0; transform: translate(-50%, 105%);
    width: min(100%, 720px); max-height: min(92dvh, 900px); padding: 8px 18px calc(20px + var(--safe-bottom));
    border-radius: 26px 26px 0 0; background: var(--surface); box-shadow: 0 -18px 50px rgba(35,34,29,.18);
    overflow-y: auto; overscroll-behavior: contain; transition: transform .28s cubic-bezier(.22,.82,.3,1);
  }
  .bottom-sheet.is-open { transform: translate(-50%, 0); }
  .sheet-handle { width: 40px; height: 4px; margin: 1px auto 12px; border-radius: 99px; background: #d5d1c8; }
  .sheet-header { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding-bottom: 16px; }
  .sticky-sheet-header { position: sticky; z-index: 2; top: -8px; padding-top: 8px; background: var(--surface); }
  .compact-sheet { max-height: 55dvh; }
  .actor-options { display: grid; gap: 10px; }
  .actor-option { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); text-align: left; cursor: pointer; }
  .actor-option strong, .actor-option small { display: block; }
  .actor-option small { margin-top: 2px; color: var(--muted); }
  .actor-option .selected-check { margin-left: auto; color: var(--sage); }

  .item-form { display: grid; gap: 17px; padding-bottom: 5px; }
  fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
  fieldset legend { margin-bottom: 9px; }
  .category-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .category-option input, .segmented input { position: absolute; opacity: 0; pointer-events: none; }
  .category-option span { display: grid; place-items: center; gap: 6px; min-height: 72px; padding: 8px 3px; border: 1px solid var(--line); border-radius: 14px; background: #fff; color: var(--muted); font-size: 10.5px; cursor: pointer; }
  .category-option b { color: var(--text); font-size: 20px; line-height: 1; }
  .category-option input:checked + span { border-color: var(--sage); background: var(--sage-soft); color: var(--sage-dark); box-shadow: inset 0 0 0 1px var(--sage); font-weight: 800; }
  .two-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
  .input-prefix { display: flex; align-items: center; min-height: 48px; padding-left: 13px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .input-prefix:focus-within { border-color: var(--sage); box-shadow: 0 0 0 3px rgba(79,111,82,.10); }
  .input-prefix span { color: var(--muted); }
  .input-prefix input { min-height: 46px; border: 0; box-shadow: none; }
  .input-prefix input:focus { box-shadow: none; }
  .segmented { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .segmented label span { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--muted); cursor: pointer; }
  .segmented input:checked + span { border-color: var(--sage); background: var(--sage-soft); color: var(--sage-dark); box-shadow: inset 0 0 0 1px var(--sage); font-weight: 800; }
  .choice-fieldset:has(input[name="priority"][value="Urgente"]:checked) label:last-child span { border-color: var(--clay); background: var(--clay-soft); color: var(--clay-dark); box-shadow: inset 0 0 0 1px var(--clay); }
  .catalog-picker { position: relative; display: grid; gap: 8px; padding: 13px; border-radius: 16px; background: var(--surface-2); }
  .catalog-search-wrap { display: flex; align-items: center; gap: 8px; padding-left: 11px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--muted); }
  .catalog-search-wrap input { min-height: 46px; padding-left: 0; border: 0; box-shadow: none; }
  .catalog-search-wrap input:focus { box-shadow: none; }
  .catalog-search-wrap:focus-within { border-color: var(--sage); box-shadow: 0 0 0 3px rgba(79,111,82,.10); }
